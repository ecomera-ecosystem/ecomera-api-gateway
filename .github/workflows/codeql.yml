name: API Gateway CodeQL

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]
  schedule:
    - cron: '0 1 * * 1'

jobs:
  call-codeql:
    uses: ecomera-ecosystem/.github/.github/workflows/codeql.yml@main
    with:
      language: 'java'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
