name: API Gateway Docker

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  call-docker:
    permissions:
      contents: read
      packages: read
    uses: ecomera-ecosystem/.github/.github/workflows/docker.yml@main
    with:
      image_name: "ammysf/ecomera-api-gateway"
      dockerfile: "./Dockerfile"
      context: "."